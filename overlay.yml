# Full overlay — same as overlay.lite.yml plus MCP servers.
#
# Mounting MCP servers adds their tool definitions to every prompt: with a
# dozen servers this reaches ~300k input tokens per delegated run, so use the
# lite overlay unless the task genuinely needs those tools.
#
# Every credential comes from the environment. Export them before starting the
# MCP host, or drop the server you do not need.

- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false

# Model route. With a DeepSeek account sign-in these are the models the API lists
# (verified 2026-10-18 against https://api.deepseek.com/models):
#   deepseek-flash   → DeepSeek-Flash
#   deepseek-v4-pro  → DeepSeek-V4-Pro
# Override without editing this file: set DSH_SUBAGENT_MODEL.
# Note: opencode-style ids such as deepseek-v4.1-flash belong to a different provider
# line; pointing at them here requires that provider's key and base_url on this profile.
- id: agent-default-model
  config:
    provider: deepseek-account
    model: !!js "process.env.DSH_SUBAGENT_MODEL || 'deepseek-flash'"
    reasoningEffort: max

- insert:
    - id: skills-from-codex
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: codex-skills
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.env.USERPROFILE ? process.env.USERPROFILE + '\\\\.codex\\\\skills' : process.env.HOME + '/.codex/skills'"

# ---------- remote (streamable HTTP) servers ----------
- insert:
    - id: mcp-firecrawl
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: firecrawl
        transport: streamable-http
        url: 'https://mcp.firecrawl.dev/v2/mcp'
        headers:
          Authorization: !!js '`Bearer ${process.env.FIRECRAWL_API_KEY || ""}`'
        failOnStartupError: false

    - id: mcp-githubcopilot
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: githubcopilot
        transport: streamable-http
        url: 'https://api.githubcopilot.com/mcp/'
        headers:
          Authorization: !!js '`Bearer ${process.env.GITHUB_PERSONAL_ACCESS_TOKEN || ""}`'
        failOnStartupError: false

    - id: mcp-amap
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: amap
        transport: streamable-http
        url: !!js '`https://mcp.amap.com/mcp?key=${process.env.AMAP_API_KEY || ""}`'
        failOnStartupError: false

# ---------- local (stdio) servers ----------
# Copy a block, point `command`/`args` at your own install and uncomment it.
# `cwd` matters for servers that resolve assets relative to the working
# directory, and `env` is where you pass keys to a local process.
